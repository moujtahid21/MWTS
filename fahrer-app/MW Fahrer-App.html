<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MW Fahrer-App — Prototyp</title>
<link rel="stylesheet" href="app-styles.css" />
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<!-- React-Hooks global verfügbar machen (Babel-Scripts haben getrennten Scope) -->
<script>
  var useState = React.useState, useEffect = React.useEffect, useRef = React.useRef,
      useMemo = React.useMemo, useCallback = React.useCallback,
      createContext = React.createContext, useContext = React.useContext;
</script>

<!-- Daten (plain JS) -->
<script src="app-data.js"></script>

<!-- Komponenten (Babel/JSX) -->
<script type="text/babel" src="app-icons.jsx"></script>
<script type="text/babel" src="app-core.jsx"></script>
<script type="text/babel" src="flow-onboarding.jsx"></script>
<script type="text/babel" src="flow-dashboard.jsx"></script>
<script type="text/babel" src="flow-pickup.jsx"></script>
<script type="text/babel" src="flow-dropoff.jsx"></script>
<script type="text/babel" src="flow-tracking.jsx"></script>
<script type="text/babel" src="flow-extras.jsx"></script>
<script type="text/babel" src="app-main.jsx"></script>
</body>
</html>
